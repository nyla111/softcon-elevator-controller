<!doctype html><html lang="en"><head><meta charset="utf-8"><title>EMS Manager Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{font-family:Inter,Segoe UI,sans-serif;color:#172033;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}.top{background:#14213d;color:white;padding:18px 24px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}h1{font-size:21px;margin:0}.top label{margin-left:auto}select{padding:7px;border-radius:7px}main{padding:20px;max-width:1400px;margin:auto}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.card,.panel{background:white;border:1px solid #dde3ed;border-radius:12px;padding:14px;box-shadow:0 2px 7px #18243b12}.metric{font-size:27px;font-weight:700}.muted{color:#667085;font-size:13px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px;border-bottom:1px solid #edf0f4}th{color:#667085}.pill{padding:3px 8px;border-radius:20px;background:#eef2ff;font-size:12px}.fault{background:#fee2e2;color:#991b1b}.ok{color:#067647}.alert{padding:9px;background:#fff7ed;border-left:4px solid #f59e0b;margin:7px 0}.empty{padding:20px;text-align:center;color:#667085}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style></head><body><header class="top"><h1>Elevator Management System</h1><span id="clock">--</span><label>View as <select id="role"><option value="owner">Owner</option><option value="facility_manager">Facility manager</option><option value="security">Security</option><option value="system_admin">System administrator</option></select></label></header>
<main><section class="cards"><div class="card"><div class="muted">Trips this month</div><div class="metric" id="trips">0</div></div><div class="card"><div class="muted">Average wait</div><div class="metric" id="wait">0.0 s</div></div><div class="card"><div class="muted">Run time</div><div class="metric" id="runtime">0.0 h</div></div><div class="card"><div class="muted">Estimated energy</div><div class="metric" id="energy">0.0 kWh</div></div></section><section class="grid"><div class="panel"><h2>Live cars</h2><table><thead><tr><th>Car</th><th>Floor / position</th><th>Direction</th><th>Doors</th><th>Load</th><th>State</th><th>Mode</th><th>Fault</th></tr></thead><tbody id="cars"></tbody></table></div><div><section class="panel"><h2>Alerts</h2><div id="alerts" class="empty">No alerts</div></section><section class="panel" style="margin-top:16px"><h2>Wait & run time</h2><div id="targets" class="muted">Loading report...</div></section></div></section></main>
<script>
const fmt=n=>Number(n||0).toFixed(1),role=()=>document.querySelector('#role').value;async function get(url){const r=await fetch(url,{headers:{'X-Role':role(),'X-User':'dashboard-user'}});return r.ok?r.json():null}function renderState(s){document.querySelector('#clock').textContent=new Date(s.time).toLocaleString();document.querySelector('#cars').innerHTML=s.cars.map(c=>`<tr><td><b>${c.car_id}</b></td><td>L${c.floor} / ${fmt(c.position)}</td><td>${c.direction}</td><td>${c.doors}</td><td>${fmt(c.load_pct)}%</td><td><span class="pill ${c.fault_code?'fault':''}">${c.state}</span></td><td>${s.modes[c.group]}</td><td>${c.fault_code||'<span class="ok">OK</span>'}</td></tr>`).join('');const a=document.querySelector('#alerts');a.innerHTML=s.alerts.length?s.alerts.slice().reverse().map(x=>`<div class="alert"><b>${x.kind}</b><br><span class="muted">${x.message}</span></div>`).join(''):'<div class="empty">No alerts</div>'}function renderReport(r){if(!r)return;const k=r.wait_and_run_time;document.querySelector('#trips').textContent=k.trips;document.querySelector('#wait').textContent=fmt(k.average_wait_s)+' s';document.querySelector('#runtime').textContent=fmt(k.run_time_s/3600)+' h';document.querySelector('#energy').textContent=fmt(k.estimated_energy_kwh)+' kWh';document.querySelector('#targets').innerHTML=`Average wait <b>${fmt(k.average_wait_s)} s</b><br>P95 wait <b>${fmt(k.p95_wait_s)} s</b><br>Run time <b>${fmt(k.run_time_s)} s</b><br>Ceiling breaches <b>${k.ceiling_breaches}</b><br><small>${k.energy_model}</small>`}async function poll(){try{const [s,r]=await Promise.all([get('/api/state'),get('/api/monitor/report')]);if(s)renderState(s);renderReport(r)}catch(e){console.error(e)}}document.querySelector('#role').addEventListener('change',poll);poll();setInterval(poll,1000);
</script></body></html>
