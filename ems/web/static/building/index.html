<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Building view</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#15181d; --panel:#1c2027; --line:#2e343e; --text:#e7e9ec; --dim:#8f98a6;
          --ok:#62b07f; --warn:#d8a446; --bad:#d8665e; --accent:#7aa2cf; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
               font:15px/1.35 "IBM Plex Sans", "Segoe UI", Roboto, Arial, sans-serif; }
  #app { display:grid; grid-template-rows:52px 1fr; height:100vh; }
  #top { display:flex; align-items:center; gap:16px; padding:0 14px; background:var(--panel);
         border-bottom:2px solid var(--line); white-space:nowrap; overflow:hidden; }
  #clock { font-size:21px; font-weight:600; min-width:230px; font-variant-numeric:tabular-nums; }
  .pill { padding:3px 10px; border-radius:4px; font-weight:600; font-size:14px; border:1px solid; }
  .ok { color:var(--ok); border-color:var(--ok); } .bad { color:var(--bad); border-color:var(--bad); }
  .warn { color:var(--warn); border-color:var(--warn); } .dim { color:var(--dim); border-color:var(--line); }
  #main { display:grid; grid-template-columns:1fr 290px 340px; min-height:0; }
  #towerwrap { min-height:0; padding:2px 4px; }
  svg { width:100%; height:100%; display:block; }
  #side, #log { background:var(--panel); border-left:1px solid var(--line); padding:10px 12px;
          overflow:auto; min-height:0; }
  #side h3, #log h3 { margin:10px 0 6px; font-size:13px; font-weight:600; color:var(--dim);
             text-transform:uppercase; letter-spacing:.06em; }
  #side label { font-size:14px; color:var(--dim); }
  select, input, button { font:inherit; font-size:14px; color:var(--text); background:#242a33;
          border:1px solid var(--line); border-radius:4px; padding:5px 8px; }
  input { width:80px; } select { max-width:150px; }
  button { cursor:pointer; font-weight:600; } button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#10151c; border-color:var(--accent); }
  .controls button { flex:1 1 46%; }
  button.on { background:#33404f; border-color:var(--accent); }
  .row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:4px 0; }
  .faults button { flex:1 1 46%; font-size:13px; padding:5px 4px; }
  #activeFaults div { color:var(--bad); font-weight:600; font-size:14px; }
  a { color:var(--accent); }
  details { margin-top:6px; } summary { cursor:pointer; color:var(--accent); font-size:14px; }
  #case input[type=number], #case input.n { width:52px; } #case select { max-width:84px; }
  #case input[type=checkbox] { padding:0; margin:0 4px 0 0; vertical-align:middle; }
  #case #cCard { width:100%; }
  #caseRows div { font:12px/1.5 ui-monospace, Menlo, Consolas, monospace; display:flex;
                  justify-content:space-between; border-bottom:1px solid #232830; }
  #caseRows button { padding:0 6px; font-size:12px; }
  #note { font-size:13px; color:var(--ok); min-height:1.2em; }
  #alertsList div { font-size:13px; color:var(--warn); margin:2px 0; }
  #ticker { font:12px/1.45 ui-monospace, Menlo, Consolas, monospace; }
  #ticker div { color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
                border-bottom:1px solid #232830; padding:1px 0; }
  #ticker div:first-child { color:var(--text); }
  text { fill:var(--text); font-family:system-ui, Arial, sans-serif; }
  .carlabel { font-size:12px; font-weight:700; paint-order:stroke; stroke:#000; stroke-width:2px; }
</style></head>
<body><div id="app">
  <div id="top">
    <div id="clock">--</div>
    <div id="modes" class="pill dim">modes</div>
    <div id="ems" class="pill ok">EMS server: UP</div>
    <div id="fallback" class="pill dim" style="display:none"></div>
    <div id="alerts" class="pill dim">alerts: 0</div>
    <div id="sim" class="pill dim" style="margin-left:auto">no live run</div>
  </div>
  <div id="main">
    <div id="towerwrap"><svg id="tower" viewBox="0 0 790 672" preserveAspectRatio="xMidYMid meet"></svg></div>
    <div id="side">
      <h3>Run</h3>
      <div class="row">
        <select id="profile"><option>up_peak</option><option>lunch</option><option>evening</option>
          <option>balanced</option><option>eco</option></select>
        <label>rate/min <input id="rate" placeholder="default" size="6"></label>
        <label>seed <input id="seed" value="1" size="4"></label>
      </div>
      <div class="row"><label title="CSV or JSON: t, origin, destination, card, accessible, vip, passenger_id. Replaces the random traffic.">passenger list
        <input id="script" type="file" accept=".csv,.json"></label></div>
      <div class="row controls"><button id="start" class="primary" title="Start a new run with these settings. The previous run and its dashboard figures are replaced (save it first).">New run</button>
        <button id="play">Pause</button>
        <button id="reset" title="Empty building, no traffic">Reset</button>
        <button id="save" title="Save this run's figures to the run history">Save run</button></div>
      <div class="row">speed <button class="spd on" data-s="1">1x</button><button class="spd" data-s="10">10x</button>
        <button class="spd" data-s="60">60x</button></div>
      <div id="note"></div>
      <details id="case"><summary>Build a test case</summary>
        <div class="row">t <input id="cT" class="n" type="number" value="0" min="0">
          from <select id="cFrom"></select> to <select id="cTo"></select></div>
        <div class="row"><input id="cCard" placeholder="card id (empty: an employee of that floor)"></div>
        <div class="row"><label><input id="cAcc" type="checkbox"> accessible</label>
          <label><input id="cVip" type="checkbox"> VIP</label>
          <button id="cAddTrip">Add trip</button></div>
        <div class="row">t <input id="cEvT" class="n" type="number" value="30" min="0">
          <select id="cEvent"></select> car <select id="cCar"></select>
          <button id="cAddEvent">Add event</button></div>
        <div id="caseRows"></div>
        <div class="row"><button id="cRun" class="primary">Run case</button>
          <button id="cCsv">Download CSV</button><button id="cClear">Clear</button></div>
      </details>
      <h3>Access control</h3>
      <div class="row"><a href="/panel/" target="_blank" rel="noopener noreferrer">Open the lobby destination panel</a></div>
      <h3>Faults</h3>
      <div class="row"><label>car <select id="car">
        <option>A</option><option>B</option><option>C</option><option>D</option>
        <option>E</option><option>F</option><option>G</option><option>H</option><option>S</option>
      </select></label></div>
      <div class="row faults" id="faultBtns">
        <button data-k="fire_alarm">Fire alarm</button><button data-k="fire_clear">Fire clear + reset</button>
        <button data-k="mains_loss">Mains loss</button><button data-k="mains_restore">Mains restore</button>
        <button data-k="car_fault">Car fault</button><button data-k="clear_fault">Clear fault</button>
        <button data-k="link_loss">Link loss (5 min)</button><button data-k="link_restore">Link restore</button>
        <button data-k="acs_outage">ACS outage (15 min)</button><button data-k="acs_restore">ACS restore</button>
        <button data-k="plugin_crash">Plug-in crash (5 min)</button><button data-k="plugin_restore">Plug-in restore</button>
        <button data-k="ems_crash">EMS server crash</button>
        <button data-k="overload_burst">Overload burst</button><button data-k="bulky_item">Bulky item</button>
      </div>
      <h3>Active faults</h3><div id="activeFaults"><div style="color:var(--dim)">none</div></div>
    </div>
    <div id="log">
      <h3>Latest alerts</h3><div id="alertsList"><div style="color:var(--dim)">none</div></div>
      <h3>Event log (newest first)</h3><div id="ticker"></div>
    </div>
  </div>
</div>
<script>
"use strict";
const NS = "http://www.w3.org/2000/svg";
const ROW = 20, TOP = 26, ROWS = 32, CAR_W = 54;
const GROUP_X = { A:160, B:226, C:292, D:358, E:432, F:498, G:564, H:630, S:704 };
const LOW_FLOORS = [-2, -1, 1,...Array.from({length:14},(_,i)=>i+2)];   // D-08: B2, B1, L1..L15
const HIGH_FLOORS = [1,...Array.from({length:15},(_,i)=>i+16)];
const STOP_PICKUP = "#38d9f5", STOP_DROPOFF = "#ffc233";   // stop ticks left of each shaft
const STATE_COLOR = { GROUP_SERVICE:"#2f9e5b", STANDBY:"#3b7bd6", FIRE_RECALL:"#d63b3b",
  EMERGENCY_POWER:"#e88a1a", FAULTED:"#8a2be2", MAINTENANCE:"#7a8497",
  INDEPENDENT_SERVICE:"#1ba5a5", VIP_EXCLUSIVE:"#c9a227" };
const idxOf = f => f < 0 ? f : f - 1;                  // B2=-2, B1=-1, L1=0 ... L30=29
const yOfIdx = i => TOP + (29 - i) * ROW;
function yOfPosition(p) {                              // p = floor number, may be fractional
  const i = p >= 1 ? p - 1 : (p <= -1 ? p : -1 + (p + 1) / 2);
  return yOfIdx(i);
}
const label = f => f < 0 ? "B" + (-f) : "L" + f;
function el(name, attrs, parent, text) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
const svg = document.getElementById("tower");
const waitCells = {};      // group -> floor -> text element
const cars = {};           // car id -> {g, body, dl, dr, bar, text, stops}

function buildTower() {
  for (let i = -2; i <= 29; i++) {                     // floor rows
    const y = yOfIdx(i), f = i < 0 ? i : i + 1;
    el("rect", { x:0, y, width:790, height:ROW, fill: i % 2 ? "#181c22" : "#1c2128" }, svg);
    el("text", { x:6, y:y + 15, "font-size":14, "font-weight":700 }, svg, label(f));
  }
  el("text", { x:50, y:10, "font-size":10, fill:"#8f98a6" }, svg, "waiting");
  [[STOP_PICKUP, "pick-up", 370], [STOP_DROPOFF, "drop-off", 440]].forEach(([fill, name, x]) => {
    el("rect", { x, y:3, width:5, height:6, fill }, svg);
    el("text", { x:x + 8, y:10, "font-size":10, fill:"#8f98a6" }, svg, name);
  });
  el("text", { x:50, y:TOP - 3, "font-size":10, fill:"#8f98a6" }, svg, "LOW");
  el("text", { x:92, y:TOP - 3, "font-size":10, fill:"#8f98a6" }, svg, "HIGH");
  waitCells.LOW = {}; waitCells.HIGH = {};
  LOW_FLOORS.forEach(f => waitCells.LOW[f] = el("text", { x:58, y:yOfIdx(idxOf(f)) + 16,
      "font-size":15, "font-weight":800, "text-anchor":"middle" }, svg, ""));
  HIGH_FLOORS.forEach(f => waitCells.HIGH[f] = el("text", { x:104, y:yOfIdx(idxOf(f)) + 16,
      "font-size":15, "font-weight":800, "text-anchor":"middle" }, svg, ""));
  for (const [id, x] of Object.entries(GROUP_X)) {     // shafts
    el("rect", { x:x - 2, y:TOP, width:CAR_W + 4, height:ROWS * ROW, fill:"#111418",
                 stroke:"#2e343e", "stroke-width":1 }, svg);
  }
  [["LOW", 160, 418], ["HIGH", 432, 690], ["SERVICE", 704, 758]].forEach(([n, a, b]) =>
    el("text", { x:(a + b) / 2, y:TOP - 6, "font-size":15, "font-weight":800, "text-anchor":"middle",
                 fill:"#7aa2cf" }, svg, n));
  for (const id of Object.keys(GROUP_X)) {             // cars
    const g = el("g", {}, svg);
    const stops = el("g", {}, g);
    const body = el("rect", { x:GROUP_X[id], width:CAR_W, height:ROW - 2, rx:3, fill:"#555",
                              stroke:"#000", "stroke-width":1 }, g);
    const dl = el("rect", { x:GROUP_X[id] + 1, width:12, height:ROW - 4, fill:"rgba(0,0,0,.6)" }, g);
    const dr = el("rect", { x:GROUP_X[id] + CAR_W - 13, width:12, height:ROW - 4, fill:"rgba(0,0,0,.6)" }, g);
    const bar = el("rect", { x:GROUP_X[id], width:0, height:3, fill:"#fff" }, g);
    const text = el("text", { x:GROUP_X[id] + CAR_W / 2, "text-anchor":"middle", class:"carlabel" }, g, id);
    cars[id] = { g, body, dl, dr, bar, text, stops };
  }
}
buildTower();

function setPill(id, cls, text) {
  const e = document.getElementById(id); e.className = "pill " + cls; e.textContent = text;
}
function fmtTime(iso) {
  const d = new Date(iso + "Z");                      // simulated wall clock, shown as UTC
  const day = d.toUTCString().slice(0, 3), hh = d.toISOString().slice(11, 19);
  return day + " " + d.toISOString().slice(0, 10) + " " + hh;
}
function render(s) {
  document.getElementById("clock").textContent = fmtTime(s.time);
  setPill("modes", "dim", Object.entries(s.modes).map(([g, m]) => g + ": " + m).join("  |  "));
  setPill("ems", s.ems.status === "up" ? "ok" : "bad", "EMS server: " + s.ems.status.toUpperCase());
  const fb = document.getElementById("fallback");
  const msgs = [];
  if (s.ems.controllers_fallback) msgs.push("controllers' group logic");
  if (s.dispatch_fallback_active) msgs.push("dispatch fallback (FR-105)");
  fb.style.display = msgs.length ? "" : "none";
  if (msgs.length) setPill("fallback", "warn", "FALLBACK: " + msgs.join(" + "));
  setPill("alerts", s.alerts_total ? "warn" : "dim", "alerts: " + s.alerts_total);
  setPill("sim", "dim", s.live ? s.live.profile + (s.live.rate ? " @" + s.live.rate + "/min" : "") +
          " seed " + s.live.seed : "no live run");

  for (const g of ["LOW", "HIGH"]) {                   // waiting counts
    const counts = s.waiting[g] || {};
    const floors = g === "LOW" ? LOW_FLOORS : HIGH_FLOORS;
    floors.forEach(f => {
      const n = counts[String(f)] || 0, c = waitCells[g][f];
      c.textContent = n || "·";
      c.setAttribute("fill", n >= 10 ? "#d8665e" : n > 0 ? "#d8a446" : "#3a414c");
    });
  }
  for (const c of s.cars) {                            // cars
    const v = cars[c.car_id]; if (!v) continue;
    const y = yOfPosition(c.position);
    const x = GROUP_X[c.car_id];
    v.body.setAttribute("y", y + 1); v.body.setAttribute("fill", STATE_COLOR[c.state] || "#667");
    const bad = c.disconnected || c.fault_code || c.link_lost;
    v.body.setAttribute("stroke", bad ? "#ff3030" : "#000");
    v.body.setAttribute("stroke-width", bad ? 3 : 1);
    v.body.setAttribute("stroke-dasharray", bad ? "5 3" : "");
    const open = { closed:12, closing:8, opening:8, open:2 }[c.doors];
    v.dl.setAttribute("y", y + 2); v.dr.setAttribute("y", y + 2);
    v.dl.setAttribute("width", open); v.dr.setAttribute("width", open);
    v.dr.setAttribute("x", x + CAR_W - 1 - open);
    v.bar.setAttribute("y", y + ROW - 4);
    v.bar.setAttribute("width", Math.min(100, c.load_pct) / 100 * CAR_W);
    v.bar.setAttribute("fill", c.load_pct >= 80 ? "#ff5d5d" : "#fff");
    v.text.setAttribute("y", y + 14);
    v.text.textContent = c.car_id + " " + Math.round(c.load_pct) + "%" + (bad ? " !" : "");
    v.stops.replaceChildren();                         // pending stops, left of the shaft
    for (const f of c.pickup_stops)
      el("rect", { x:x - 7, y:yOfIdx(idxOf(f)) + 3, width:5, height:6, fill:STOP_PICKUP }, v.stops);
    for (const f of c.dropoff_stops)
      el("rect", { x:x - 7, y:yOfIdx(idxOf(f)) + 11, width:5, height:6, fill:STOP_DROPOFF }, v.stops);
  }
  const af = document.getElementById("activeFaults");
  af.innerHTML = s.active_faults.length ? "" : '<div style="color:var(--dim)">none</div>';
  s.active_faults.forEach(t => { const d = document.createElement("div"); d.textContent = t; af.appendChild(d); });
  const al = document.getElementById("alertsList"); al.replaceChildren();
  if (!s.alerts.length) al.innerHTML = '<div style="color:var(--dim)">none</div>';
  s.alerts.slice(-8).reverse().forEach(a => { const d = document.createElement("div");
    d.textContent = a.t.toFixed(0) + "s [" + a.severity + "] " + a.kind; d.title = a.message || "";
    al.appendChild(d); });
  const tk = document.getElementById("ticker"); tk.replaceChildren();
  s.events.slice().reverse().forEach(line => { const d = document.createElement("div");
    d.textContent = line; d.title = line; tk.appendChild(d); });
}

// ---------------------------------------------------------------- controls
let playing = false, speed = 1, busy = false;
async function post(url, body) {
  const r = await fetch(url, { method:"POST", headers:{ "Content-Type":"application/json" },
                               body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) throw new Error(url + " -> " + r.status + " " + await r.text());
  return r.json();
}
async function tick() {
  if (busy) return; busy = true;
  try {
    if (playing) await post("/api/advance?seconds=" + (speed * 0.2));
    render(await (await fetch("/api/state")).json());
  } catch (e) { console.error(e); } finally { busy = false; }
}
(function loop() { tick().finally(() => setTimeout(loop, playing ? 200 : 1000)); })();

function setPlaying(on) {
  playing = on; const b = document.getElementById("play");
  b.textContent = on ? "Pause" : "Resume"; b.classList.toggle("on", !on);
}
function note(text) { document.getElementById("note").textContent = text; }
async function startLive(profile, rate, seed) {
  const file = document.getElementById("script").files[0];       // fixed list instead of random
  const script = file ? await file.text() : null;
  try {
    await post("/api/live/start", { profile, rate: rate === "" || rate == null ? null : Number(rate),
                                    seed: Number(seed), script });
  } catch (e) { alert(e.message); return; }
  note(""); setPlaying(true);
}
document.getElementById("start").onclick = () => startLive(
  document.getElementById("profile").value, document.getElementById("rate").value,
  document.getElementById("seed").value || 1);
document.getElementById("play").onclick = () => setPlaying(!playing);

// ---- build a test case by hand: rows become a passenger list (ems/sim/scripted.py)
const CASE_EVENTS = ["fire_alarm", "fire_clear", "mains_loss", "mains_restore", "car_fault",
  "clear_fault", "link_loss", "link_restore", "acs_outage", "acs_restore", "plugin_crash",
  "plugin_restore", "ems_crash", "overload_burst", "bulky_item", "fm_confirm"];
const CAR_EVENTS = ["car_fault", "clear_fault", "link_loss", "link_restore", "overload_burst",
  "bulky_item"];
const caseRows = [];
const floorName = f => f < 1 ? "B" + (-f) : "L" + f;
function fillSelect(id, values, label) {
  const sel = document.getElementById(id);
  values.forEach(v => { const o = document.createElement("option"); o.value = v;
    o.textContent = label ? label(v) : v; sel.appendChild(o); });
}
const ALL_FLOORS = [-2, -1, ...Array.from({length:30}, (_, i) => i + 1)];
fillSelect("cFrom", ALL_FLOORS, floorName); fillSelect("cTo", ALL_FLOORS, floorName);
document.getElementById("cTo").value = "5";
fillSelect("cEvent", CASE_EVENTS);
fillSelect("cCar", ["A", "B", "C", "D", "E", "F", "G", "H", "S"]);
function renderCase() {
  const box = document.getElementById("caseRows"); box.replaceChildren();
  caseRows.sort((a, b) => a.t - b.t).forEach((r, i) => {
    const d = document.createElement("div"), x = document.createElement("button");
    d.textContent = r.event
      ? `${r.t}s ${r.event}${r.car ? " " + r.car : ""}`
      : `${r.t}s ${floorName(r.origin)}>${floorName(r.destination)} ${r.card || ""}` +
        `${r.accessible ? " acc" : ""}${r.vip ? " vip" : ""}`;
    x.textContent = "x"; x.onclick = () => { caseRows.splice(i, 1); renderCase(); };
    d.appendChild(x); box.appendChild(d);
  });
}
document.getElementById("cAddTrip").onclick = () => {
  const r = { t: Number(document.getElementById("cT").value || 0),
    origin: Number(document.getElementById("cFrom").value),
    destination: Number(document.getElementById("cTo").value),
    card: document.getElementById("cCard").value.trim(),
    accessible: document.getElementById("cAcc").checked,
    vip: document.getElementById("cVip").checked };
  if (r.origin === r.destination) { alert("From and to are the same floor."); return; }
  const zone = f => f === 1 ? null : (f <= 15 ? "low-rise (B2-L15)" : "high-rise (L16-L30)");
  if (zone(r.origin) && zone(r.destination) && zone(r.origin) !== zone(r.destination)) {
    alert("A trip stays in one group. Add two trips with a change at L1, e.g. " +
          floorName(r.origin) + " > L1, then L1 > " + floorName(r.destination) + " a bit later.");
    return;
  }
  caseRows.push(r); renderCase();
};
document.getElementById("cAddEvent").onclick = () => {
  const event = document.getElementById("cEvent").value;
  caseRows.push({ t: Number(document.getElementById("cEvT").value || 0), event,
    car: CAR_EVENTS.includes(event) ? document.getElementById("cCar").value : "" });
  renderCase();
};
function caseCsv() {
  const lines = ["t,origin,destination,card,accessible,vip,event,car"];
  for (const r of caseRows) lines.push(r.event
    ? `${r.t},,,,,,${r.event},${r.car}`
    : `${r.t},${r.origin},${r.destination},${r.card},${r.accessible ? "true" : ""},${r.vip ? "true" : ""},,`);
  return lines.join("\n");
}
document.getElementById("cRun").onclick = async () => {
  if (!caseRows.some(r => !r.event)) { alert("Add at least one trip."); return; }
  try {
    await post("/api/live/start", { profile: "up_peak", seed: Number(document.getElementById("seed").value || 1),
                                    script: caseCsv() });
  } catch (e) { alert(e.message); return; }
  note("Test case running: " + caseRows.length + " rows."); setPlaying(true);
};
document.getElementById("cCsv").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([caseCsv() + "\n"], { type: "text/csv" }));
  a.download = "test_case.csv"; a.click();
};
document.getElementById("cClear").onclick = () => { caseRows.length = 0; renderCase(); };
document.getElementById("reset").onclick = async () => {
  try { await post("/api/reset?seed=" + Number(document.getElementById("seed").value || 1)); }
  catch (e) { alert(e.message); return; }
  setPlaying(false); note("Reset: empty building, no traffic.");
};
document.getElementById("save").onclick = async () => {
  const name = prompt("Name for this run (optional):", "");
  if (name === null) return;
  try { const r = await post("/api/runs/save", { name: name || null }); note("Saved: " + r.run_id); }
  catch (e) { alert(e.message); }
};
document.querySelectorAll(".spd").forEach(b => b.onclick = () => {
  speed = Number(b.dataset.s);
  document.querySelectorAll(".spd").forEach(x => x.classList.toggle("on", x === b));
});
document.querySelectorAll("#faultBtns button").forEach(b => b.onclick = async () => {
  try { await post("/api/live/fault", { kind: b.dataset.k, car_id: document.getElementById("car").value }); }
  catch (e) { console.error(e); }
});
document.addEventListener("keydown", e => { if (e.code === "Space" && e.target.tagName === "BODY") { e.preventDefault(); setPlaying(!playing); } });

setPlaying(false);
const q = new URLSearchParams(location.search);       // ?profile=&rate=&seed=&autostart=1
if (q.get("profile")) document.getElementById("profile").value = q.get("profile");
if (q.get("rate")) document.getElementById("rate").value = q.get("rate");
if (q.get("seed")) document.getElementById("seed").value = q.get("seed");
if (q.get("autostart")) startLive(document.getElementById("profile").value,
  document.getElementById("rate").value, document.getElementById("seed").value || 1);
</script></body></html>
